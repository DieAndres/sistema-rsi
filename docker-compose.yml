services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-https://localhost:8443}"
      NGINX_ENVSUBST_FILTER: '^PUBLIC_ORIGIN$'
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-8443}:443"
    volumes:
      - ${TLS_CERT_DIRECTORY:-./infrastructure/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - backend
  backend:
    build: ./backend
    container_name: sistema-rsi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "3001"
      WEBAUTHN_ORIGIN: "${PUBLIC_ORIGIN:-https://localhost:8443}"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - -e
      - "const url = new URL(process.env.DATABASE_URL); url.hostname = 'postgres'; url.port = '5432'; process.env.DATABASE_URL = url.href; require('./dist/main.js');"
  postgres:
    image: postgres:16-alpine
    container_name: sistema-rsi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
