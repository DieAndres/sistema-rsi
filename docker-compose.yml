services:
  backend:
    build: ./backend
    container_name: sistema-rsi-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - node
      - -e
      - "const url = new URL(process.env.DATABASE_URL); url.hostname = 'postgres'; url.port = '5432'; process.env.DATABASE_URL = url.href; require('./dist/main.js');"
  postgres:
    image: postgres:16-alpine
    container_name: sistema-rsi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
