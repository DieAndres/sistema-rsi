# Empty keys leave non-authentication requests out of the stricter bucket.
map $uri $auth_limit_key {
    default "";
    ~*^/api/v1/auth/(login|mfa/confirm)/?$ $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=auth_requests:2m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 ${PUBLIC_ORIGIN}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=auth_requests burst=4 nodelay;
        limit_req zone=api_requests burst=40 nodelay;
        limit_req_status 429;
        # Preserve /api/v1, the global prefix used by NestJS.
        # Docker DNS resolves the backend again if its container is replaced.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:3001;
        proxy_pass http://$backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
